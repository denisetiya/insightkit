name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: |
          if [ -d src/insightkit ]; then
            uv run mypy src/insightkit
          else
            echo "src/insightkit not created yet — skipping mypy"
          fi
      - name: Test
        run: |
          uv run pytest -m "not e2e" -v || test $? -eq 5
      - name: Golden set sanity
        run: uv run insightkit golden -g tests/golden/orders.yml
      - name: Build
        run: uv build
