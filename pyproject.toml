[project]
name = "insightkit"
version = "0.1.0"
description = "Enterprise text-to-SQL analytics library (on-prem)"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy[asyncio]>=2.0",
  "psycopg[binary]>=3.2",
  "aiosqlite>=0.20",
  "openai>=1.40",
  "polars-lts-cpu>=1.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "PyYAML>=6.0",
  "typer>=0.12",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pyjwt>=2.8",
  "structlog>=24.1",
  "plotly>=5.22",
  "asyncmy>=0.2.13",
  "motor>=3.7.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-benchmark>=4.0",
  "testcontainers[postgres,mysql]>=4.5",
  "ruff>=0.5",
  "mypy>=1.10",
  "httpx>=0.27",
]

[project.scripts]
insightkit = "insightkit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insightkit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/insightkit/cli.py" = ["B008"]  # typer.Option/Argument in defaults is idiomatic
"src/insightkit/api/*.py" = ["B008"]  # FastAPI Depends/Query in defaults is idiomatic

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["src/insightkit"]
# dynamic DB/LLM libs make these flags noisy without catching real bugs
disallow_any_generics = false
disallow_untyped_defs = false
disallow_untyped_calls = false
warn_return_any = false

[[tool.mypy.overrides]]
module = [
  "yaml", "plotly.*", "polars.*", "openai.*", "motor.*", "psycopg.*",
  "aiosqlite", "jwt", "pydantic_settings.*", "testcontainers.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["e2e: end-to-end tests requiring real LLM/DB (not run in CI)"]
