<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InsightKit — Tanya Datamu</title>
<style>
  :root {
    --blue: #2563eb; --cyan: #06b6d4; --ink: #0f172a; --muted: #64748b;
    --bg: #f8fafc; --card: #ffffff; --line: #e2e8f0; --soft: #f1f5f9;
    --ok: #059669; --warn: #d97706; --err: #dc2626;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Inter, sans-serif; background: var(--bg); color: var(--ink); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: var(--card); border-bottom: 1px solid var(--line); flex-shrink: 0; }
  .logo { width: 32px; height: 32px; border-radius: 9px; background: linear-gradient(135deg, var(--blue), var(--cyan)); display: grid; place-items: center; flex-shrink: 0; }
  .logo svg { width: 18px; height: 18px; }
  header h1 { font-size: 16px; font-weight: 700; }
  header .sub { font-size: 12px; color: var(--muted); }
  .spacer { flex: 1; }
  .btn { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; padding: 7px 14px; font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { border-color: var(--cyan); color: var(--blue); }
  .btn.primary { background: linear-gradient(135deg, var(--blue), var(--cyan)); color: #fff; border: none; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 20px; border-bottom: 1px solid var(--line); background: var(--card); flex-shrink: 0; }
  .chip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 5px 12px; font-size: 12px; color: var(--muted); cursor: pointer; }
  .chip:hover { border-color: var(--cyan); color: var(--blue); }
  .chip:disabled { opacity: .4; cursor: not-allowed; }

  .main { flex: 1; display: flex; min-height: 0; }
  /* ---- kiri: chat ---- */
  .chat-pane { width: 46%; min-width: 400px; max-width: 560px; border-right: 1px solid var(--line); display: flex; flex-direction: column; background: var(--card); }
  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 100%; }
  .user-msg { align-self: flex-end; background: linear-gradient(135deg, var(--blue), var(--cyan)); color: #fff; border-radius: 14px 14px 4px 14px; padding: 9px 13px; font-size: 13.5px; line-height: 1.45; }
  .ai-msg { background: var(--soft); border: 1px solid var(--line); border-radius: 4px 14px 14px 14px; padding: 10px 13px; font-size: 13.5px; cursor: pointer; }
  .ai-msg:hover { border-color: var(--cyan); }
  .ai-msg .preview { color: var(--ink); white-space: pre-wrap; line-height: 1.45; }
  .ai-msg .ai-meta { display: flex; gap: 8px; margin-top: 7px; font-size: 11px; color: var(--muted); align-items: center; }
  .ai-msg .view-link { color: var(--blue); font-weight: 600; font-size: 11.5px; }
  .thinking { color: var(--muted); font-size: 12.5px; font-style: italic; }
  .badge { padding: 2px 8px; border-radius: 999px; font-weight: 700; font-size: 10.5px; }
  .badge.ok { background: #ecfdf5; color: var(--ok); } .badge.no_data { background: #fffbeb; color: var(--warn); } .badge.error { background: #fef2f2; color: var(--err); } .badge.cached { background: #eff6ff; color: var(--blue); }
  .err { color: var(--err); font-size: 12.5px; margin-top: 8px; }
  #inputbar { display: flex; gap: 10px; padding: 12px 16px 14px; border-top: 1px solid var(--line); }
  #q { flex: 1; resize: none; border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; font: inherit; font-size: 13.5px; outline: none; max-height: 130px; }
  #q:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(6,182,212,.15); }
  #q:disabled { background: var(--soft); }

  /* ---- kanan: hasil ---- */
  .result-pane { flex: 1; overflow-y: auto; padding: 20px; background: var(--bg); }
  #placeholder { color: var(--muted); text-align: center; margin-top: 18vh; font-size: 14px; }
  #placeholder svg { opacity: .25; margin-bottom: 12px; }
  .result-card { max-width: 900px; margin: 0 auto; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; box-shadow: 0 1px 3px rgba(15,23,42,.05); }
  .result-q { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
  .meta { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: var(--muted); margin-bottom: 14px; }
  .meta b { color: var(--ink); font-weight: 600; }
  .insight { font-size: 15px; line-height: 1.65; white-space: pre-wrap; }
  .section-label { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 18px 0 6px; }
  .chart-box { min-height: 400px; width: 100%; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
  th { background: var(--soft); font-weight: 600; position: sticky; top: 0; }
  .table-wrap { max-height: 320px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; }
  .rowcount { font-size: 11px; color: var(--muted); padding: 6px; }
  details { margin-top: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--soft); }
  summary { cursor: pointer; padding: 8px 12px; font-size: 12.5px; font-weight: 600; color: var(--blue); }
  code.sql { display: block; padding: 10px 12px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; overflow-x: auto; white-space: pre-wrap; }
  .thinking { color: var(--muted); font-size: 13px; font-style: italic; }

  /* modal */
  .overlay { position: fixed; inset: 0; background: rgba(15,23,42,.4); display: none; place-items: center; z-index: 50; }
  .overlay.open { display: grid; }
  .modal { background: var(--card); border-radius: 16px; padding: 24px; width: min(440px, 92vw); }
  .modal h2 { font-size: 16px; margin-bottom: 4px; }
  .modal .hint { font-size: 12px; color: var(--muted); margin-bottom: 16px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; }
  .field input { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; font: inherit; font-size: 13px; outline: none; }
  .field input:focus { border-color: var(--cyan); }
  .modal .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
  .status-test { font-size: 12px; margin-top: 8px; }
  .status-test.ok { color: var(--ok); } .status-test.err { color: var(--err); }
  ::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 3v18h18"/><path d="M7 14l3-4 3 3 4-6"/>
    </svg>
  </div>
  <div>
    <h1>InsightKit</h1>
    <div class="sub">Tanya datamu pakai bahasa natural</div>
  </div>
  <div class="spacer"></div>
  <button class="btn" id="settingsBtn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    Pengaturan
  </button>
</header>

<div class="chips" id="chips">
  <button class="chip">berapa total revenue dari orders yang status paid?</button>
  <button class="chip">berapa jumlah orders?</button>
  <button class="chip">revenue per bulan di 2025?</button>
  <button class="chip">kota mana customer paling banyak?</button>
</div>

<div class="main">
  <div class="chat-pane">
    <div id="chat"></div>
    <div id="inputbar">
      <textarea id="q" rows="1" placeholder="Tanya datamu… (Enter kirim, Shift+Enter baris baru)" disabled></textarea>
      <button class="btn primary" id="send" disabled>Kirim</button>
    </div>
  </div>

  <div class="result-pane">
    <div id="placeholder">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 3v18h18"/><path d="M7 14l3-4 3 3 4-6"/></svg>
      <div>Kirim pertanyaan — insight, chart, dan hasil query tampil di sini</div>
    </div>
    <div id="result" style="display:none"></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2>Pengaturan Koneksi</h2>
    <div class="hint">URL API & API key disimpan di browser (localStorage).</div>
    <div class="field"><label>API URL</label><input id="apiUrl" placeholder="https://insightkit.denisetiya.site"></div>
    <div class="field"><label>API Key</label><input id="apiKey" type="password" placeholder="ik_..."></div>
    <div class="status-test" id="testStatus"></div>
    <div class="actions">
      <button class="btn" id="testBtn">Tes Koneksi</button>
      <button class="btn primary" id="saveBtn">Simpan</button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const cfg = { url: localStorage.getItem("ik_url") || "https://insightkit.denisetiya.site", key: localStorage.getItem("ik_key") || "" };
let busy = false;
const results = [];   // hasil tiap pertanyaan
let activeIdx = -1;   // index hasil yang lagi tampil di panel kanan

function setCfg(){ cfg.url = $("apiUrl").value.trim().replace(/\/+$/, ""); cfg.key = $("apiKey").value.trim(); localStorage.setItem("ik_url", cfg.url); localStorage.setItem("ik_key", cfg.key); }
function esc(s){ const d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; }
function now(){ return new Date().toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit", second: "2-digit" }); }

function setBusy(b){
  busy = b;
  $("send").disabled = b;
  $("q").disabled = b;
  document.querySelectorAll(".chip").forEach(c => c.disabled = b);
  $("q").placeholder = b ? "Memproses pertanyaan… mohon tunggu" : "Tanya datamu… (Enter kirim, Shift+Enter baris baru)";
}

function addUserBubble(q){
  const d = document.createElement("div"); d.className = "msg";
  d.innerHTML = `<div class="user-msg">${esc(q)}</div>`;
  $("chat").appendChild(d); d.scrollIntoView({ behavior: "smooth", block: "end" });
}

function addAiBubble(idx){
  const d = document.createElement("div"); d.className = "msg";
  d.innerHTML = `<div class="ai-msg" id="ai-${idx}"><div class="thinking">Menghubungi InsightKit…</div></div>`;
  $("chat").appendChild(d);
  d.querySelector(".ai-msg").onclick = () => showResult(idx);
  d.scrollIntoView({ behavior: "smooth", block: "end" });
  return d.querySelector(".ai-msg");
}

function updateAiBubble(idx){
  const r = results[idx]; const b = $("ai-" + idx); if (!b) return;
  b.innerHTML = `<div class="preview">${esc((r.insight || r.error || "Selesai").slice(0, 140))}${(r.insight||"").length > 140 ? "…" : ""}</div>` +
    `<div class="ai-meta"><span class="badge ${r.status || "ok"}">${esc(r.status || "ok")}</span>` +
    `<span>${r.latency_ms}ms · ${r.tokens} token</span><span class="view-link">Lihat hasil →</span></div>`;
}

async function ask(q){
  if (busy) return;
  setBusy(true);
  addUserBubble(q);
  const idx = results.length;
  results.push({ q, status: "…", insight: "", chart: null, columns: [], rows: [], sql: "", meta: "", error: "" });
  const bubble = addAiBubble(idx);

  if (!/^https?:\/\//i.test(cfg.url)) {
    results[idx].status = "error"; results[idx].error = "API URL belum diisi — klik Pengaturan, isi URL + API key, lalu Simpan.";
    updateAiBubble(idx); setBusy(false); $("overlay").classList.add("open");
    return;
  }
  try {
    const res = await fetch(cfg.url + "/api/v1/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-API-Key": cfg.key },
      body: JSON.stringify({ question: q }),
    });
    if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error(d.detail || `HTTP ${res.status}`); }
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = "";
    for (;;) {
      const { done, value } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) !== -1) {
        handle(buf.slice(0, i), idx); buf = buf.slice(i + 2);
      }
    }
  } catch (e) {
    results[idx].status = "error";
    results[idx].error = "Gagal: " + e.message + (cfg.key ? "" : " — isi API key dulu di Pengaturan.");
  }
  updateAiBubble(idx);
  setBusy(false);
  $("q").focus();
}

function handle(block, idx){
  const r = results[idx];
  const ev = block.match(/^event: (\w+)/m)?.[1];
  const dm = block.match(/^data: (.+)/ms);
  if (!ev || !dm) return;
  let d; try { d = JSON.parse(dm[1]); } catch { return; }
  if (ev === "plan") { const b = $("ai-" + idx); if (b) b.querySelector(".thinking").textContent = `Memproses dengan ${d.model} (${d.schema_tables} tabel)…`; }
  else if (ev === "retry") { const b = $("ai-" + idx); if (b) b.querySelector(".thinking").textContent = `Coba ulang: ${d.error}…`; }
  else if (ev === "sql") { r.sql = d.sql; }
  else if (ev === "result") { r.columns = d.columns; r.rows = d.rows; r.row_count = d.row_count; }
  else if (ev === "insight") { r.insight = d.insight; }
  else if (ev === "chart") { r.chart = d.chart; if (idx === activeIdx) renderChart(idx); }
  else if (ev === "done") {
    r.status = d.status + (d.cached ? " (cached)" : "");
    r.latency_ms = d.latency_ms; r.tokens = d.tokens; r.row_count = d.row_count; r.error = d.error || "";
    if (idx === activeIdx) showResult(idx);
  }
}

function showResult(idx){
  activeIdx = idx;
  const r = results[idx];
  $("placeholder").style.display = "none";
  $("result").style.display = "block";
  let h = `<div class="result-card">`;
  h += `<div class="result-q">${esc(r.q)}</div>`;
  h += `<div class="meta"><span class="badge ${r.status && !/cached/.test(r.status) ? r.status.split(" ")[0] : "ok"}">${esc(r.status || "…")}</span>` +
       (r.latency_ms ? `<span>latency <b>${r.latency_ms}ms</b></span>` : "") +
       (r.tokens ? `<span>tokens <b>${r.tokens}</b></span>` : "") +
       (r.row_count != null ? `<span>baris <b>${r.row_count}</b></span>` : "") + `</div>`;
  if (r.error) h += `<div class="err">${esc(r.error)}</div>`;
  if (r.insight) h += `<div class="insight">${esc(r.insight)}</div>`;
  if (r.chart) { h += `<div class="section-label">Chart</div><div class="chart-box" id="chart-${idx}"></div>`; }
  if (r.columns.length) {
    h += `<div class="section-label">Hasil Query</div><div class="table-wrap"><table><thead><tr>` +
         r.columns.map(c => `<th>${esc(c)}</th>`).join("") + `</tr></thead><tbody>` +
         r.rows.map(row => `<tr>` + r.columns.map(c => `<td>${esc(row[c])}</td>`).join("") + `</tr>`).join("") +
         `</tbody></table></div><div class="rowcount">${r.row_count ?? r.rows.length} baris</div>`;
  }
  if (r.sql) h += `<details><summary>Lihat SQL</summary><code class="sql">${esc(r.sql)}</code></details>`;
  h += `</div>`;
  $("result").innerHTML = h;
  $("result").scrollTop = 0;
  if (r.chart) renderChart(idx);
}

function renderChart(idx){
  const el = $("chart-" + idx); const r = results[idx];
  if (!el || !r.chart) return;
  el.innerHTML = '<div class="thinking">Memuat chart…</div>';
  loadPlotly()
    .then(P => {
      const layout = Object.assign({}, r.chart.layout || {});
      delete layout.template;
      Object.assign(layout, { height: 400, autosize: true, margin: { t: 30, r: 20, b: 50, l: 60 } });
      P.newPlot(el, r.chart.data, layout, { responsive: true, displayModeBar: true, displaylogo: false });
    })
    .catch(e => { el.innerHTML = `<div class="err">Chart tidak bisa dirender (Plotly CDN diblokir?): ${esc(e.message)}</div>`; });
}

function loadPlotly(){
  return new Promise((resolve, reject) => {
    if (window.Plotly) return resolve(window.Plotly);
    const urls = [
      "https://cdn.plotly.com/plotly-2.35.2.min.js",
      "https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.35.2/plotly.min.js",
      "https://unpkg.com/plotly.js-dist-min@2.35.2/plotly.min.js",
    ];
    let i = 0;
    const tryNext = () => {
      if (i >= urls.length) return reject(new Error("semua CDN gagal"));
      const s = document.createElement("script");
      s.src = urls[i++];
      s.onload = () => (window.Plotly ? resolve(window.Plotly) : tryNext());
      s.onerror = tryNext;
      document.head.appendChild(s);
    };
    tryNext();
  });
}

$("send").onclick = () => { const q = $("q").value.trim(); if (!q || busy) return; $("q").value = ""; $("q").style.height = "auto"; ask(q); };
$("q").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); if (!busy) $("send").click(); } });
$("q").addEventListener("input", () => { $("q").style.height = "auto"; $("q").style.height = Math.min($("q").scrollHeight, 130) + "px"; });
$("chips").addEventListener("click", (e) => { if (e.target.classList.contains("chip") && !busy) ask(e.target.textContent); });

$("settingsBtn").onclick = () => { $("apiUrl").value = cfg.url; $("apiKey").value = cfg.key; $("testStatus").textContent = ""; $("overlay").classList.add("open"); };
$("overlay").onclick = (e) => { if (e.target === $("overlay")) $("overlay").classList.remove("open"); };
$("saveBtn").onclick = () => { setCfg(); $("overlay").classList.remove("open"); $("q").focus(); };
$("testBtn").onclick = async () => {
  const base = $("apiUrl").value.trim().replace(/\/+$/, ""); const key = $("apiKey").value.trim();
  const st = $("testStatus");
  if (!/^https?:\/\//i.test(base)) { st.className = "status-test err"; st.textContent = "✗ URL harus http(s):// — contoh: https://insightkit.denisetiya.site"; return; }
  try {
    const r = await fetch(base + "/api/v1/health", { headers: { "X-API-Key": key } });
    if (r.ok) { const h = await r.json(); st.className = "status-test ok"; st.textContent = `✓ Terhubung — database: ${h.database ? "OK" : "DOWN"}, model: ${h.model}`; }
    else { st.className = "status-test err"; st.textContent = `✗ HTTP ${r.status} — ${r.status === 401 ? "API key salah" : "URL salah?"}`; }
  } catch { st.className = "status-test err"; st.textContent = "✗ Gagal terhubung — cek URL / koneksi."; }
};

setBusy(false); // input aktif dari awal
$("q").focus();
</script>
</body>
</html>
